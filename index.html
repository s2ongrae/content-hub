<!-- ───────────── 설정 ───────────── -->
<dialog id="settings-dialog" class="sheet">
  <div class="sheet-card">
    <header class="sheet-head">
      <h2>설정</h2>
      <button type="button" class="icon-btn" data-close="settings-dialog" aria-label="닫기">✕</button>
    </header>

    <div class="sheet-body">
      <section class="panel">
        <h3>구글 시트 서버 연결</h3>
        <p class="hint">한 번만 넣으면 됩니다. 값은 이 기기 브라우저에만 저장됩니다.</p>
        <label class="field">
          <span class="field-label">서버 주소 <code>/exec</code></span>
          <input id="in-gas-url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="https://script.google.com/macros/s/AKfy…/exec">
        </label>
        <label class="field">
          <span class="field-label">연결 열쇠 (API 토큰)</span>
          <span class="input-row">
            <input id="in-token" type="password" autocomplete="off" spellcheck="false"
                   placeholder="시트 메뉴 → 2. API 토큰 확인">
            <button type="button" id="btn-toggle-token" class="ghost-btn">보기</button>
          </span>
        </label>
        <p class="hint">
          두 값은 <b>이 브라우저에만</b> 저장되고, 저장소(깃허브)에는 올라가지 않습니다.
        </p>
        <div class="row">
          <button type="button" id="btn-test" class="btn" title="주소와 열쇠가 맞는지 확인합니다">연결 확인</button>
          <button type="button" id="btn-save-cfg" class="btn primary">저장</button>
        </div>
        <div id="conn-result" class="result" hidden></div>
      </section>

      <section class="panel">
        <h3>안전</h3>
        <p class="hint">
          계정 비밀번호·쿠키·인증번호는 이 앱이 저장하지 않습니다. 로그인 확인·인증이 필요하면 카드가 <b>직접 확인</b> 칸으로 갑니다.
        </p>
        <button type="button" id="btn-clear-token" class="ghost-btn danger">연결 열쇠 지우기</button>
      </section>

      <p class="version">Content Hub OS · M1 · <span id="build-label">v2-m54</span></p>
    </div>
  </div>
</dialog>

<!-- ───────────── 상세 ───────────── -->
